[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localdeploy"
dynamic = ["version", "dependencies"]
description = "A local web UI and OpenAI-compatible API for choosing, running, and benchmarking models with Ollama and other local runtimes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "oney-erge" }]
keywords = ["ollama", "llm", "local-ai", "benchmark", "vram", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "ruff==0.16.0",
  "build>=1.2",
  "twine>=5.0",
  "playwright>=1.40",
  "pillow>=10.0",
]
# Desktop tray launcher + PyInstaller build (Windows .exe/.msi, macOS .app/.dmg).
# Not required to run LocalDeploy itself - only to build the bundled apps.
packaging = [
  "pyinstaller>=6.0",
  "pystray>=0.19",
  "pillow>=10.0",
]

[project.scripts]
localdeploy = "localdeploy.cli:main"

[project.urls]
Homepage = "https://github.com/oney-erge/LocalDeploy"
Documentation = "https://github.com/oney-erge/LocalDeploy#readme"
Changelog = "https://github.com/oney-erge/LocalDeploy/blob/main/CHANGELOG.md"
Issues = "https://github.com/oney-erge/LocalDeploy/issues"

[tool.setuptools]
# The four root modules ship alongside the package: api_server is the ASGI app
# the console script serves; the others are companion CLIs that expect it.
py-modules = ["api_server", "benchmark", "chat_cli", "compare_models"]

[tool.setuptools.dynamic]
version = { attr = "localdeploy.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["localdeploy*"]

[tool.setuptools.package-data]
localdeploy = ["web/*", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep CI's established baseline explicit. Ruff 0.16 broadened its implicit
# defaults, which made a dependency-only update surface unrelated preview and
# style families across the entire repository.
select = ["E4", "E7", "E9", "F"]
